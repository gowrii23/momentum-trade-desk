name: Morning Nifty Confirmation

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC, Mon–Fri
    - cron: "30 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run morning Nifty confirmation
        run: python daily_scan.py --morning

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Morning Nifty confirmation $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Publish morning summary
        if: always()
        run: |
          if [ -f data/report.md ]; then
            {
              echo "## Morning Nifty Confirmation"
              echo ""
              sed -n '/## Morning trade confirmation/,/## Nifty daily plan\|## Nifty trade tracker\|## Stock momentum/p' data/report.md || head -40 data/report.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
