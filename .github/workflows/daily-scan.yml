name: Daily EOD Scan

on:
  schedule:
    # 19:00 IST = 13:30 UTC, Mon–Fri
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EOD scan
        run: python daily_scan.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily EOD scan $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Publish report summary
        if: always()
        run: |
          if [ -f data/report.md ]; then
            {
              echo "## EOD Scan Report"
              echo ""
              cat data/report.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
